services:
  - type: web
    name: steam-player-credibility
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: STEAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: STEAM_NAME_ALIASES
        sync: false
